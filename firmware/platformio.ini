[env:unor4wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

; ✅ 默认栈配置（BSP_CFG_STACK_MAIN_BYTES=0x400=1KB不足以运行WiFi+BLE）
;    通过减少BSS来自然扩大栈空间: g_workBuf 4KB→512B 省出3.5KB
build_flags =
    -I ${platformio.packages_dir}/framework-arduinorenesas-uno/libraries/BlockDevices
    -DWEBSOCKETS_DEBUG_LEVEL=0
    -DWEBSOCKETS_NETWORK_IPCLASS=1
    -DWEBSOCKETS_NETWORK_ESPASYNC=1
    -DWEBSOCKETS_SERVER_CLIENT_MAX=1  ; [v3.9.35] Only 1 WS client - reduces RAM, avoids WS library multi-client state bugs
    -Wl,--defsym=__stack_size__=0x1800  # 增大栈到 6KB (原4KB仍会导致堆损坏崩溃)

lib_deps = 
    Links2004/WebSockets@^2.4.1
    ArduinoBLE @ 2.0.1
    EEPROM
    bblanchon/ArduinoJson@^7.0.0

lib_extra_dirs = 
    ${platformio.packages_dir}/framework-arduinorenesas-uno/libraries/BlockDevices

monitor_speed = 115200
monitor_filters = default